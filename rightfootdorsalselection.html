<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Right Foot Issue Selector</title>
<style>
  :root {
    --bg-primary: #0b1120;
    --bg-surface: #1e293b;
    --accent: #38bdf8;
    --accent-hover: #0284c7;
    --text-main: #f8fafc;
    --border: #475569;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { 
    height: 100%; 
    width: 100%; 
    overflow: hidden; 
    background: var(--bg-primary); 
    display: flex;
    flex-direction: column;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text-main);
  }

  /* ---------- Header ---------- */
  .header {
    flex: 0 0 auto;
    text-align: center;
    padding: 18px 20px 0px 20px;
    font-size: 1.05rem;
    font-weight: 500;
    background: var(--bg-primary);
    z-index: 10;
  }

  /* ---------- Canvas & X-Ray SVG Styling ---------- */
  .canvas-container {
    flex: 1 1 auto;
    min-height: 0; /* Critical for preventing flexbox overflow on mobile */
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 15px; 
  }
  .svg-wrapper {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .svg-wrapper svg {
    max-height: 100%;
    max-width: 100%;
    object-fit: contain;
    display: block;
    pointer-events: all;
  }
  
  /* X-Ray Aesthetic Overrides */
  /* Target ALL paths (bones, toenails, etc.) for a balanced slate-blue line */
  .svg-wrapper svg path {
    fill: transparent !important;
    stroke: #7284a1 !important; /* Perfect middle-ground color */
    stroke-width: 1px !important;
    vector-effect: non-scaling-stroke !important; /* Keeps lines crisp */
  }
  
  /* Target ONLY the main outer foot outline to be thin white */
  #Top-of-right-foot > g:first-child path {
    stroke: #ffffff !important;
    stroke-width: 1.5px !important; 
  }

  /* Restore opacity for bones so they aren't dulled */
  #Bones, #Bones g {
    opacity: 1 !important; 
  }

  /* Universally hide ALL image hit-masks by default to remove patchy white blocks */
  .svg-wrapper svg use {
    opacity: 0;
    transition: opacity 0.15s ease;
  }
  /* Reveal the masks ONLY when hovered or selected, letting the SVG filter apply color */
  .svg-wrapper svg g.rgn-hover use,
  .svg-wrapper svg g.rgn-selected use {
    opacity: 1;
  }

  .svg-wrapper.pointing { cursor: pointer; }

  /* Apply the custom highlight filters */
  .rgn-hover { filter: url(#fxHover); }
  .rgn-selected { filter: url(#fxSelected); }
  .rgn-selected.rgn-hover { filter: url(#fxSelectedHover); }

  /* ---------- UI Overlays & Bottom Bar ---------- */
  .bottom-bar {
    flex: 0 0 auto;
    background: var(--bg-surface);
    padding: 15px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10;
  }
  .btn-send {
    background: var(--accent);
    color: var(--bg-primary);
    border: none;
    border-radius: 8px;
    padding: 14px 32px;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    max-width: 400px;
    transition: background 0.2s ease, transform 0.1s ease;
    box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25);
  }
  .btn-send:hover { background: var(--accent-hover); }
  .btn-send:active { transform: scale(0.98); }

  .tooltip {
    position: absolute;
    pointer-events: none;
    background: rgba(15,23,42,.96);
    border: 1px solid var(--accent);
    color: #fff;
    padding: 6px 12px;
    font-size: 0.85rem;
    font-weight: 500;
    border-radius: 6px;
    white-space: nowrap;
    display: none;
    z-index: 100;
    box-shadow: 0 4px 14px rgba(0,0,0,.5);
    transform: translate(-50%, -140%);
  }
  .loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
    background: rgba(12, 16, 28, 0.9);
    z-index: 200;
    font-size: 0.85rem;
    color: var(--text-main);
  }
  .spinner {
    width: 26px;
    height: 26px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>

<div class="header">Tap the areas where you feel pain or discomfort.</div>

<div class="bottom-bar">
  <button id="sendBtn" class="btn-send">Email Podiatrist</button>
</div>

<script>
(function () {
  "use strict";

  var ALPHA_THRESHOLD = 24; 
  var XLINK = "http://www.w3.org/1999/xlink";

  var wrapper   = document.getElementById("svgWrapper");
  var svg       = wrapper.querySelector("svg");
  var tooltip   = document.getElementById("tooltip");
  var loadingEl = document.getElementById("loading");
  var loadingTx = document.getElementById("loadingText");
  var canvasBox = document.querySelector(".canvas-container");
  var sendBtn   = document.getElementById("sendBtn");

  /* ---------- 1. Inject the highlight filters ---------- */
  var filterMarkup =
    '<defs id="highlightFilters">' +
      '<filter id="fxHover" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">' +
        '<feFlood flood-color="#3b82f6" flood-opacity="0.45" result="f"/>' +
        '<feComposite in="f" in2="SourceAlpha" operator="in" result="tint"/>' +
        '<feMerge><feMergeNode in="tint"/></feMerge>' +
      '</filter>' +
      '<filter id="fxSelected" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">' +
        '<feFlood flood-color="#f43f5e" flood-opacity="0.55" result="f"/>' +
        '<feComposite in="f" in2="SourceAlpha" operator="in" result="tint"/>' +
        '<feMerge><feMergeNode in="tint"/></feMerge>' +
      '</filter>' +
      '<filter id="fxSelectedHover" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">' +
        '<feFlood flood-color="#fb7185" flood-opacity="0.75" result="f"/>' +
        '<feComposite in="f" in2="SourceAlpha" operator="in" result="tint"/>' +
        '<feMerge><feMergeNode in="tint"/></feMerge>' +
      '</filter>' +
    '</defs>';
  
  if(svg) {
      svg.insertAdjacentHTML("afterbegin", filterMarkup);
  }

  /* ---------- 2. Build the region model ---------- */
  var ACRONYMS = { mtp:"MTP", tmt:"TMT", ip:"IP", hav:"HAV" };

  function prettify(id) {
    // Strip "right-top-" or "right-" prefixes
    var s = id.replace(/^right-top-/, "").replace(/^right-/, "");
    return s.split("-").map(function (w) {
      var low = w.toLowerCase();
      if (ACRONYMS[low]) return ACRONYMS[low];
      if (w === w.toUpperCase() && w.length <= 4) return w; 
      return low.charAt(0).toUpperCase() + low.slice(1);
    }).join(" ");
  }

  var regions = [];

  if(svg) {
      Array.prototype.forEach.call(svg.querySelectorAll('g[id]'), function (g) {
        // Look specifically for right foot IDs
        if (!/^right-/.test(g.id)) return;
        var uses = g.querySelectorAll("use");
        if (!uses.length) return;

        var hits = [];
        Array.prototype.forEach.call(uses, function (use) {
          var href = use.getAttributeNS(XLINK, "href") || use.getAttribute("href");
          if (!href) return;
          var img = svg.querySelector(href);
          if (!img) return;
          var data = img.getAttributeNS(XLINK, "href") || img.getAttribute("href");
          hits.push({
            use: use,
            src: data,
            x: parseFloat(use.getAttribute("x")) || 0,
            y: parseFloat(use.getAttribute("y")) || 0,
            w: parseFloat(use.getAttribute("width"))  || parseFloat(img.getAttribute("width"))  || 1,
            h: parseFloat(use.getAttribute("height")) || parseFloat(img.getAttribute("height")) || 1,
            alpha: null, iw: 0, ih: 0, inv: null
          });
        });
        if (!hits.length) return;

        var rec = {
          id: g.id,
          el: g,
          label: prettify(g.id),
          hits: hits,
          selected: false
        };
        g.style.pointerEvents = "none";
        regions.push(rec);
      });
  }

  /* ---------- 3. Decode the alpha masks ---------- */
  var pending = 0, total = 0, pixelReady = false;

  regions.forEach(function (r) { total += r.hits.length; });
  pending = total;

  function maskLoaded() {
    pending--;
    loadingTx.textContent = "Loading... " + (total - pending) + "/" + total;
    if (pending <= 0) {
      pixelReady = true;
      loadingEl.style.display = "none";
    }
  }

  regions.forEach(function (r) {
    r.hits.forEach(function (h) {
      var im = new Image();
      im.onload = function () {
        try {
          var c = document.createElement("canvas");
          c.width  = im.naturalWidth;
          c.height = im.naturalHeight;
          var ctx = c.getContext("2d", { willReadFrequently: true });
          ctx.drawImage(im, 0, 0);
          var d = ctx.getImageData(0, 0, c.width, c.height).data;
          var a = new Uint8Array(c.width * c.height);
          for (var i = 0, j = 3; i < a.length; i++, j += 4) a[i] = d[j];
          h.alpha = a; h.iw = c.width; h.ih = c.height;
        } catch (e) {
          h.alpha = null;
        }
        maskLoaded();
      };
      im.onerror = maskLoaded;
      im.src = h.src;
    });
  });

  if (total === 0) { pixelReady = true; loadingEl.style.display = "none"; }

  /* ---------- 4. Hit testing ---------- */
  var pt = svg ? svg.createSVGPoint() : null;

  function invalidateMatrices() {
    regions.forEach(function (r) { r.hits.forEach(function (h) { h.inv = null; }); });
  }
  window.addEventListener("resize", invalidateMatrices);
  window.addEventListener("scroll", invalidateMatrices, true);

  function matrixFor(h) {
    if (h.inv) return h.inv;
    var ctm = h.use.parentNode.getScreenCTM();
    if (!ctm) return null;
    var own = h.use.transform && h.use.transform.baseVal.consolidate();
    if (own) ctm = ctm.multiply(own.matrix);
    try { h.inv = ctm.inverse(); } catch (e) { return null; }
    return h.inv;
  }

  function hitTest(clientX, clientY) {
    if(!pt) return null;
    for (var i = regions.length - 1; i >= 0; i--) {
      var r = regions[i];
      for (var k = 0; k < r.hits.length; k++) {
        var h = r.hits[k];
        var inv = matrixFor(h);
        if (!inv) continue;
        pt.x = clientX; pt.y = clientY;
        var p = pt.matrixTransform(inv);
        var u = (p.x - h.x) / h.w, v = (p.y - h.y) / h.h;
        if (u < 0 || u >= 1 || v < 0 || v >= 1) continue;
        if (!h.alpha) return r;
        var px = Math.floor(u * h.iw), py = Math.floor(v * h.ih);
        if (h.alpha[py * h.iw + px] > ALPHA_THRESHOLD) return r;
      }
    }
    return null;
  }

  /* ---------- 5. Visual state ---------- */
  var hovered = null;

  function paint(r) {
    if (!r) return;
    r.el.classList.toggle("rgn-selected", r.selected);
    r.el.classList.toggle("rgn-hover", hovered === r);
  }

  function setHover(r) {
    if (hovered === r) return;
    var prev = hovered;
    hovered = r;
    paint(prev);
    paint(r);
    wrapper.classList.toggle("pointing", !!r);
  }

  function toggle(r) {
    r.selected = !r.selected;
    paint(r);
    updateSendButton();
  }

  function selectedLabels() {
    return regions.filter(function (r) { return r.selected; })
                  .map(function (r) { return r.label; });
  }

  function updateSendButton() {
    var count = regions.filter(function (r) { return r.selected; }).length;
    sendBtn.textContent = count > 0 ? "Email Podiatrist (" + count + ")" : "Email Podiatrist";
  }

  /* ---------- 6. Pointer handling on the diagram ---------- */
  var queued = null, rafId = 0;

  if(svg) {
      svg.addEventListener("mousemove", function (e) {
        queued = e;
        if (rafId) return;
        rafId = requestAnimationFrame(function () {
          rafId = 0;
          var ev = queued;
          if (!ev) return;
          var r = hitTest(ev.clientX, ev.clientY);
          setHover(r);
          if (r) {
            var box = canvasBox.getBoundingClientRect();
            tooltip.style.display = "block";
            tooltip.style.left = (ev.clientX - box.left) + "px";
            tooltip.style.top  = (ev.clientY - box.top)  + "px";
            tooltip.textContent = r.label;
          } else {
            tooltip.style.display = "none";
          }
        });
      });

      svg.addEventListener("mouseleave", function () {
        setHover(null);
        tooltip.style.display = "none";
      });

      svg.addEventListener("click", function (e) {
        var r = hitTest(e.clientX, e.clientY);
        if (r) toggle(r);
      });

      svg.addEventListener("touchstart", function (e) {
        if (!e.touches.length) return;
        var t = e.touches[0];
        var r = hitTest(t.clientX, t.clientY);
        if (r) { toggle(r); e.preventDefault(); }
      }, { passive: false });
  }

  /* ---------- 7. Send to Email ---------- */
  sendBtn.addEventListener("click", function() {
    var labels = selectedLabels();
    if (labels.length === 0) {
        alert("Please select at least one area on the foot diagram before sending.");
        return;
    }
    
    var subject = encodeURIComponent("Patient Foot Issue Report");
    var bodyText = "Hello,\n\nI am experiencing issues with the following areas on the dorsal side of my right foot:\n\n";
    
    labels.forEach(function(label) {
        bodyText += "- " + label + "\n";
    });
    
    bodyText += "\nPlease let me know when we can schedule an appointment to discuss this.\n\nThank you.";
    
    window.location.href = "mailto:?subject=" + subject + "&body=" + encodeURIComponent(bodyText);
  });

})();
</script>
